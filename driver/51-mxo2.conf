# WirePlumber: a stable PipeWire node name for the MXO2's video device ("Matrox MXO2 Mini", all inputs).
# Without it WirePlumber builds node.name from the card's PCI path, which changes with the slot.
# Pick the input with the device's "Input" control (Auto = the input with a signal).
# Installed to /etc/wireplumber/wireplumber.conf.d/ by install.sh.
monitor.v4l2.rules = [
  {
    matches = [ { api.v4l2.cap.card = "Matrox MXO2 Mini" } ]
    actions = { update-props = { node.name = "v4l2_input.mxo2-mini", node.description = "Matrox MXO2 Mini" } }
  }
]
