# WirePlumber: unique PipeWire node names for the MXO2's two video devices.
# Both share the card's PCI path, from which WirePlumber builds node.name, so without this they get the same name
# and apps that identify cameras by node name (OBS "Video Capture Device (PipeWire)") show only one of them.
# Installed to /etc/wireplumber/wireplumber.conf.d/ by install.sh.
monitor.v4l2.rules = [
  {
    matches = [ { api.v4l2.cap.card = "Matrox MXO2 Mini HDMI" } ]
    actions = { update-props = { node.name = "v4l2_input.mxo2-mini-hdmi", node.description = "Matrox MXO2 Mini HDMI" } }
  }
  {
    matches = [ { api.v4l2.cap.card = "Matrox MXO2 Mini Composite" } ]
    actions = { update-props = { node.name = "v4l2_input.mxo2-mini-composite", node.description = "Matrox MXO2 Mini Composite" } }
  }
]
